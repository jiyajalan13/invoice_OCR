<!DOCTYPE html>
<html>
<head>
    <title>OCR Result</title>
</head>

<body>

    <h1>OCR Result</h1>

    {% if error %}

        <p style="color: #b00020;">{{ error }}</p>

    {% elif extracted_text %}

        <h2>Extracted Text</h2>

        <pre>{{ extracted_text }}</pre>

    {% else %}

        <p>No text could be detected in this image.</p>

    {% endif %}

    <br>

    <a href="/">
        Upload Another Invoice
    </a>

</body>
</html>
